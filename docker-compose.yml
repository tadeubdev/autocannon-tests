services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mock
      POSTGRES_PASSWORD: mock
      POSTGRES_DB: mock
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  mock-api:
    build: ./mock-api
    ports:
      - "3001:3001"